<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de Revisão — Peças por Modelo</title>
<style>
  :root{
    --bg: #e7e7e7;
    --panel: #ffffff;
    --panel-2: #eef2f6;
    --line: #dfe4ea;
    --accent: #ff7a1a;
    --accent-dim: #ff7a1a1a;
    --blue: #ff7a1a;
    --green: #16a34a;
    --text: #1c2128;
    --text-dim: #6b7280;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
    --sans: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin:0; padding:0; }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }

  /* ======== HEADER ======== */
  header{
    padding: 30px 24px 22px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(120deg, #1f1f1f 0%, #464646 100%);
  }
  header .header-inner{
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header .logo{
    height: 120px;
    width: auto;
    max-width: 180px;
    object-fit: contain;
  }
  @media (max-width: 760px){
    header .logo{ height: 34px; }
  }
  header .tag{
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 2px;
    color: #fff;
    text-transform: uppercase;
    margin-bottom: 8px;
    display: inline-block;
    background: var(--accent);
    padding: 3px 9px;
    border-radius: 999px;
  }
  header h1{
    font-size: clamp(22px, 4vw, 30px);
    font-weight: 800;
    letter-spacing: -0.5px;
    color: #e9e9e9;
  }
  header p{
    color: var(--text-dim);
    font-size: 13.5px;
    margin-top: 6px;
    color: #e9e9e9;
  }

  /* ======== MODULE TABS ======== */
  .module-tabs{
    max-width: 1100px;
    margin: 0 auto;
    padding: 18px 24px 0;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .tab-btn{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    font-family: var(--sans);
    transition: background .15s, border-color .15s, color .15s;
  }
  .tab-btn:hover{ border-color: var(--accent); background: var(--accent-dim); }
  .tab-btn.active{
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* ======== LAYOUT ======== */
  .wrap{
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 20px;
  }
  @media (max-width: 760px){
    .wrap{ grid-template-columns: 1fr; padding: 16px; }
  }

  /* ======== MODEL LIST (sidebar) ======== */
  .model-list{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    height: fit-content;
    position: sticky;
    top: 16px;
    box-shadow: 0 1px 3px rgba(16,24,40,.05);
  }
  @media (max-width: 760px){
    .model-list{
      position: static;
      top: auto;
      margin-bottom: 4px;
      max-height: none;
    }
  }
  .model-list .group-label{
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    text-transform: uppercase;
    padding: 12px 14px 6px;
  }
  .model-btn{
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-left: 3px solid transparent;
    color: var(--text);
    padding: 11px 14px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    transition: background .15s, border-color .15s;
  }
  .model-btn:hover{ background: var(--panel-2); }
  .model-btn.active{
    background: var(--accent-dim);
    border-left-color: var(--accent);
    color: var(--accent);
    font-weight: 700;
  }
  .model-btn .count{
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-dim);
    background: var(--panel-2);
    padding: 2px 6px;
    border-radius: 999px;
  }
  .model-btn.active .count{ color: #fff; background: var(--accent); }

  /* ======== DETAIL PANEL ======== */
  .detail{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 22px;
    min-height: 300px;
    box-shadow: 0 1px 3px rgba(16,24,40,.05);
  }
  .detail-header{
    display:flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 10px;
    padding-bottom: 14px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }
  .detail-header h2{
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.3px;
    color: var(--blue);
  }
  .detail-header .subtitle{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  table{
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  thead th{
    text-align: left;
    font-size: 10.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 700;
    padding: 8px 6px;
    border-bottom: 2px solid var(--line);
  }
  thead th.num{ text-align: right; }
  thead th.center{ text-align: center; }
  tbody td{
    padding: 10px 6px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }
  tbody tr:hover{ background: var(--panel-2); }
  th.photo-col, td.photo{
    width: 56px;
  }
  .thumb{
    width: 44px;
    height: 44px;
    border-radius: 8px;
    object-fit: cover;
    display: block;
    border: 1px solid var(--line);
    background: var(--panel-2);
    cursor: zoom-in;
    transition: transform .15s;
  }
  .thumb:hover{ transform: scale(1.08); }
  .thumb-placeholder{
    width: 44px;
    height: 44px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    background: var(--panel-2);
    border: 1px dashed var(--line);
    color: var(--text-dim);
  }

  /* ======== LIGHTBOX ======== */
  .lightbox-overlay{
    position: fixed;
    inset: 0;
    background: rgba(12,16,22,.82);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 30px;
    cursor: zoom-out;
  }
  .lightbox-overlay.open{ display: flex; }
  .lightbox-overlay img{
    max-width: min(90vw, 640px);
    max-height: 85vh;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,.4);
    object-fit: contain;
    background: #fff;
  }
  .lightbox-caption{
    position: absolute;
    bottom: 28px;
    left: 0;
    right: 0;
    text-align: center;
    color: #fff;
    font-size: 13.5px;
    font-family: var(--sans);
  }
  .lightbox-close{
    position: absolute;
    top: 18px;
    right: 22px;
    color: #fff;
    font-size: 26px;
    font-weight: 300;
    cursor: pointer;
    line-height: 1;
    opacity: .8;
  }
  .lightbox-close:hover{ opacity: 1; }
  /* ======== KIT SELECTOR ======== */
  .kit-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 10px;
    margin-bottom: 6px;
  }
  .kit-btn{
    text-align: left;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 13px 14px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    font-family: var(--sans);
    transition: background .15s, border-color .15s, color .15s;
  }
  .kit-btn:hover{ border-color: var(--accent); background: var(--accent-dim); }
  .kit-btn.active{
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }
  .kit-btn .kit-count{
    display: block;
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 500;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .kit-btn.active .kit-count{ color: var(--accent); }
  .kit-hint{
    color: var(--text-dim);
    font-size: 13px;
    padding: 14px 2px 4px;
  }
  .kit-section-title{
    font-size: 16px;
    font-weight: 800;
    color: var(--text);
    margin: 18px 0 12px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }
  .kit-section-title .kit-item-count{
    font-weight: 500;
    font-size: 11.5px;
    color: var(--text-dim);
    font-family: var(--mono);
  }
  td.qty{
    text-align: center;
    font-family: var(--mono);
    font-weight: 600;
  }
  td.unit{
    text-align: right;
    font-family: var(--mono);
    color: var(--text-dim);
    white-space: nowrap;
  }
  td.unit.zero{ font-style: italic; }

  td.code{
    font-family: var(--mono);
    color: var(--blue);
    font-size: 12.5px;
    white-space: nowrap;
    font-weight: 600;
  }
  td.price{
    text-align: right;
    font-family: var(--mono);
    font-weight: 700;
    white-space: nowrap;
    color: var(--green);
  }
  td.price.zero{ color: var(--text-dim); font-style: italic; font-weight: 500; }
  td.total-price{
    text-align: right;
    font-family: var(--mono);
    font-weight: 700;
    white-space: nowrap;
    color: var(--accent);
  }

  tfoot td{
    padding: 14px 6px 4px;
    font-weight: 800;
    font-size: 16px;
    border-top: 2px solid var(--accent);
  }
  tfoot td.price{
    color: var(--accent);
    font-family: var(--mono);
    text-align: right;
  }

  .empty-state{
    display:flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    height: 260px;
    color: var(--text-dim);
    gap: 8px;
  }
  .empty-state .big{ font-size: 34px; }

  footer{
    text-align: center;
    color: var(--text-dim);
    font-size: 11.5px;
    padding: 24px;
    font-family: var(--mono);
  }

  /* ======== WARRANTY CALCULATOR ======== */
  .qty-row{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    gap: 10px;
  }
  .qty-row:last-of-type{ border-bottom: none; }
  .qty-row label{
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
  }
  .qty-input{
    width: 64px;
    padding: 6px 6px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-family: var(--mono);
    text-align: center;
    font-size: 13px;
    color: var(--text);
    background: var(--panel);
  }
  .qty-input:focus{ outline: none; border-color: var(--accent); }
  .generate-btn-wrap{ padding: 14px; }
  .generate-btn{
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    font-family: var(--sans);
    transition: opacity .15s;
  }
  .generate-btn:hover{ opacity: .9; }
  .export-bar{ margin-bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  .export-btn{
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 16px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    color: var(--text);
    font-family: var(--sans);
    transition: background .15s, border-color .15s, color .15s;
  }
  .export-btn:hover{ border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }

  .warranty-total-row td{
    padding-top: 14px;
    border-top: 2px solid var(--accent);
    font-weight: 800;
    font-size: 16px;
  }
  .warranty-total-row td.total-label{ text-align: right; }
  .warranty-total-row td.total-value{
    font-family: var(--mono);
    color: var(--accent);
    text-align: right;
    font-size: 16px;
  }
</style>
</head>

</div>

<div class="wrap" id="garantiaSection" style="display:none;">

</div>

<div class="lightbox-overlay" id="lightbox" onclick="closeLightbox(event)">

const LOGO_URL = "";

function formatBRL(v){
  return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

/* ===================== MÓDULO: CATÁLOGO (original, intocado) ===================== */

function renderList(){
  const listEl = document.getElementById('modelList');
  listEl.innerHTML = '<div class="group-label">Modelos (' + MODELS.length + ')</div>';
  MODELS.forEach((model, idx) => {
    const btn = document.createElement('button');
    btn.className = 'model-btn';
    btn.id = 'model-btn-' + idx;
    btn.innerHTML = '<span>' + model.name + '</span><span class="count">' + model.kits.length + ' kits</span>';
    btn.addEventListener('click', () => selectModel(idx));
    listEl.appendChild(btn);
  });
}

let currentModelIdx = null;
let currentKitIdx = null;

function selectModel(idx){
  currentModelIdx = idx;
  currentKitIdx = null;
  document.querySelectorAll('#modelList .model-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('model-btn-' + idx).classList.add('active');
  renderDetail();
}

function selectKit(kitIdx){
  currentKitIdx = kitIdx;
  renderDetail();
}

function renderDetail(){
  const detailEl = document.getElementById('detail');

  if(currentModelIdx === null){
    detailEl.innerHTML =
      '<div class="empty-state">' +
        '<div class="big">🔧</div>' +
        '<div>Selecione um modelo na lista ao lado</div>' +
      '</div>';
    return;
  }

  const model = MODELS[currentModelIdx];

  const kitButtons = model.kits.map((kit, ki) => {
    const activeClass = ki === currentKitIdx ? ' active' : '';
    return '<button class="kit-btn' + activeClass + '" onclick="selectKit(' + ki + ')">' +
      '<span>' + kit.name + '</span>' +
      '<span class="kit-count">' + kit.parts.length + ' itens</span>' +
      '</button>';
  }).join('');

  let html =
    '<div class="detail-header">' +
      '<div>' +
        '<h2>' + model.name + '</h2>' +
        '<div class="subtitle">Selecione o kit de revisão</div>' +
      '</div>' +
    '</div>' +
    '<div class="kit-grid">' + kitButtons + '</div>';

  if(currentKitIdx === null){
    html += '<div class="kit-hint">Selecione um kit acima para ver os itens.</div>';
  } else {
    const kit = model.kits[currentKitIdx];
    const total = kit.parts.reduce((sum, p) => sum + (p.qty * p.price), 0);

    const rows = kit.parts.map(p => {
      const zeroClass = p.price === 0 ? ' zero' : '';
      const lineTotal = p.qty * p.price;
      const unitText = p.price === 0 ? 'Sob consulta' : formatBRL(p.price);
      const totalText = p.price === 0 ? 'Sob consulta' : formatBRL(lineTotal);
      const photoCell = p.photo
        ? '<img class="thumb" src="' + p.photo + '" alt="' + p.desc + '" onclick="openLightbox(\'' + p.photo.replace(/'/g, "\\'") + '\', \'' + p.desc.replace(/'/g, "\\'") + '\')" onerror="this.outerHTML=\'<div class=&quot;thumb-placeholder&quot;>🔩</div>\'">'
        : '<div class="thumb-placeholder">🔩</div>';
      return '<tr>' +
        '<td class="photo">' + photoCell + '</td>' +
        '<td class="code">' + p.code + '</td>' +
        '<td>' + p.desc + '</td>' +
        '<td class="qty">' + p.qty + '</td>' +
        '<td class="unit' + zeroClass + '">' + unitText + '</td>' +
        '<td class="price' + zeroClass + '">' + totalText + '</td>' +
        '</tr>';
    }).join('');

    html +=
      '<div class="kit-section-title">' +
        '<span>' + kit.name + '</span>' +
        '<span class="kit-item-count">' + kit.parts.length + ' itens no kit</span>' +
      '</div>' +
      '<table>' +
        '<thead><tr>' +
          '<th class="photo-col"></th>' +
          '<th>Código</th>' +
          '<th>Descrição</th>' +
          '<th class="center">Qtd</th>' +
          '<th class="num">Valor Unit.</th>' +
          '<th class="num">Valor Total</th>' +
        '</tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
        '<tfoot><tr><td colspan="5">Total do kit</td><td class="price">' + formatBRL(total) + '</td></tr></tfoot>' +
      '</table>';
  }

  detailEl.innerHTML = html;
}

renderList();

if(LOGO_URL){
  const logoEl = document.getElementById('logo');
  logoEl.src = LOGO_URL;
  logoEl.style.display = '';
  logoEl.onerror = function(){ this.style.display = 'none'; };
}

function openLightbox(src, caption){
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox-caption').textContent = caption;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox(e){
  if (e) e.stopPropagation();
  document.getElementById('lightbox').classList.remove('open');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeLightbox();
});

/* ===================== MÓDULO: CALCULADORA DE KITS DE GARANTIA (novo) ===================== */

const WARRANTY_KIT_NAME = "Kit Período Garantia Completo";

function getWarrantyData(){
  return MODELS.map(m => {
    const kit = m.kits.find(k => k.name === WARRANTY_KIT_NAME);
    return { name: m.name, parts: kit ? kit.parts : [] };
  });
}

const WARRANTY_DATA = getWarrantyData();
let warrantyResults = null;

function renderWarrantyList(){
  const el = document.getElementById('warrantyModelList');
  let html = '<div class="group-label">Modelos (' + WARRANTY_DATA.length + ')</div>';
  WARRANTY_DATA.forEach((m, idx) => {
    html += '<div class="qty-row">' +
      '<label for="wq-' + idx + '">' + m.name + '</label>' +
      '<input type="number" min="0" step="1" class="qty-input" id="wq-' + idx + '" value="0">' +
      '</div>';
  });
  html += '<div class="generate-btn-wrap"><button class="generate-btn" onclick="generateWarrantyList()">Gerar Lista</button></div>';
  el.innerHTML = html;
}

function generateWarrantyList(){
  const consolidated = {};

  WARRANTY_DATA.forEach((m, idx) => {
    const input = document.getElementById('wq-' + idx);
    const qtyKits = parseInt(input.value, 10);
    if(!qtyKits || qtyKits <= 0) return;

    m.parts.forEach(p => {
      const totalQty = p.qty * qtyKits;
      if(!consolidated[p.code]){
        consolidated[p.code] = { 
          code: p.code, 
          desc: p.desc, 
          qty: 0, 
          price: p.price, 
          photo: p.photo || '',
          models: new Set() 
        };
      }
      consolidated[p.code].qty += totalQty;
      consolidated[p.code].models.add(m.name);
    });
  });

  const rows = Object.values(consolidated).sort((a, b) => a.code.localeCompare(b.code));
  warrantyResults = rows;
  renderWarrantyResults(rows);
}

function renderWarrantyResults(rows){
  const detailEl = document.getElementById('warrantyDetail');

  if(!rows || rows.length === 0){
    detailEl.innerHTML =
      '<div class="empty-state">' +
        '<div class="big">🧮</div>' +
        '<div>Informe as quantidades de kits e clique em "Gerar Lista"</div>' +
      '</div>';
    return;
  }

  let totalGeral = 0;
  const rowsHtml = rows.map(r => {
    const totalItem = r.qty * r.price;
    totalGeral += totalItem;
    const photoCell = r.photo
      ? '<img class="thumb" src="' + r.photo + '" alt="' + r.desc + '" onclick="openLightbox(\'' + r.photo.replace(/'/g, "\\'") + '\', \'' + r.desc.replace(/'/g, "\\'") + '\')" onerror="this.outerHTML=\'<div class=&quot;thumb-placeholder&quot;>🔩</div>\'">'
      : '<div class="thumb-placeholder">🔩</div>';
    return '<tr>' +
      '<td class="photo">' + photoCell + '</td>' +
      '<td class="code">' + r.code + '</td>' +
      '<td>' + r.desc + '</td>' +
      '<td>' + Array.from(r.models).join(', ') + '</td>' +
      '<td class="qty">' + r.qty + '</td>' +
      '<td class="unit">' + formatBRL(r.price) + '</td>' +
      '<td class="total-price">' + formatBRL(totalItem) + '</td>' +
      '</tr>';
  }).join('');

  detailEl.innerHTML =
    '<div class="detail-header">' +
      '<div>' +
        '<h2>Lista Consolidada de Kits de Garantia</h2>' +
        '<div class="subtitle">' + rows.length + ' itens únicos</div>' +
      '</div>' +
    '</div>' +
    '<div class="export-bar">' +
      '<button class="export-btn" onclick="exportWarrantyPDF()">📄 Exportar PDF</button>' +
      '<button class="export-btn" onclick="exportWarrantyExcel()">📊 Exportar Excel</button>' +
    '</div>' +
    '<table>' +
      '<thead><tr>' +
        '<th class="photo-col"></th>' +
        '<th>Código</th>' +
        '<th>Descrição</th>' +
        '<th>Modelo(s)</th>' +
        '<th class="center">Qtd</th>' +
        '<th class="num">Valor Unit.</th>' +
        '<th class="num">Valor Total</th>' +
      '</tr></thead>' +
      '<tbody>' + rowsHtml + '</tbody>' +
      '<tfoot><tr class="warranty-total-row">' +
        '<td colspan="6" class="total-label">Total Geral</td>' +
        '<td class="total-value">' + formatBRL(totalGeral) + '</td>' +
      '</tr></tfoot>' +
    '</table>';
}

function exportWarrantyExcel(){
  if(!warrantyResults || warrantyResults.length === 0) return;
  const data = warrantyResults.map(r => ({
    'Código': r.code,
    'Descrição': r.desc,
    'Modelo(s)': Array.from(r.models).join(', '),
    'Quantidade': r.qty,
    'Valor Unitário': r.price,
    'Valor Total': r.qty * r.price
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  ws['!cols'] = [{ wch: 12 }, { wch: 42 }, { wch: 30 }, { wch: 12 }, { wch: 14 }, { wch: 16 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Kits Garantia');
  XLSX.writeFile(wb, 'Kits_Garantia.xlsx');
}

function exportWarrantyPDF(){
  if(!warrantyResults || warrantyResults.length === 0) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4', orientation: 'landscape' });

  doc.setFontSize(16);
  doc.setTextColor(28, 33, 40);
  doc.text('Lista Consolidada de Kits de Garantia', 40, 40);

  let totalGeral = 0;
  const body = warrantyResults.map(r => {
    const totalItem = r.qty * r.price;
    totalGeral += totalItem;
    return [
      r.code,
      r.desc,
      Array.from(r.models).join(', '),
      String(r.qty),
      formatBRL(r.price),
      formatBRL(totalItem)
    ];
  });

  doc.autoTable({
    startY: 60,
    head: [['Código', 'Descrição', 'Modelo(s)', 'Qtd', 'Valor Unit.', 'Valor Total']],
    body: body,
    styles: { fontSize: 8, cellPadding: 4 },
    headStyles: { fillColor: [255, 122, 26], textColor: [255, 255, 255] },
    columnStyles: {
      0: { cellWidth: 45 },
      1: { cellWidth: 100 },
      2: { cellWidth: 100 },
      3: { cellWidth: 30, halign: 'center' },
      4: { cellWidth: 50, halign: 'right' },
      5: { cellWidth: 50, halign: 'right' }
    },
    didDrawPage: function(data) {
      // Rodapé com data/hora
      const now = new Date();
      const dateStr = now.toLocaleString('pt-BR');
      doc.setFontSize(9);
      doc.setTextColor(107, 114, 128);
      doc.text('Gerado em: ' + dateStr, 40, doc.internal.pageSize.height - 20);
    }
  });

  // Total geral - posicionado corretamente
  const finalY = doc.lastAutoTable.finalY + 20;
  const pageWidth = doc.internal.pageSize.width;
  
  doc.setFontSize(12);
  doc.setTextColor(255, 122, 26);
  doc.setFont('helvetica', 'bold');
  
  // Calcular a posição X para alinhar à direita da tabela
  // A tabela termina na posição: data.cursor.x (que é a posição final)
  // Vamos usar a largura da página menos uma margem
  const text = 'Total Geral: ' + formatBRL(totalGeral);
  const textWidth = doc.getStringUnitWidth(text) * 12 / doc.internal.scaleFactor;
  const rightMargin = 40;
  const xPos = pageWidth - rightMargin - textWidth;
  
  doc.text(text, xPos, finalY);

  doc.save('Kits_Garantia.pdf');
}

function switchModule(mod){
  const catalogSection = document.getElementById('catalogSection');
  const garantiaSection = document.getElementById('garantiaSection');
  const tabCatalogo = document.getElementById('tab-catalogo');
  const tabGarantia = document.getElementById('tab-garantia');

  if(mod === 'catalogo'){
    catalogSection.style.display = '';
    garantiaSection.style.display = 'none';
    tabCatalogo.classList.add('active');
    tabGarantia.classList.remove('active');
  } else {
    catalogSection.style.display = 'none';
    garantiaSection.style.display = '';
    tabCatalogo.classList.remove('active');
    tabGarantia.classList.add('active');
  }
}

renderWarrantyList();
renderWarrantyResults(null);
